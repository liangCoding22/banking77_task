[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "banking77-task"
version = "0.1.0"
description = "Prompt-based BANKING77 intent classification with Qwen3-4B via Fireworks batch inference."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["datasets>=2.20.0", "requests>=2.31.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
banking77 = "banking77_task.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
